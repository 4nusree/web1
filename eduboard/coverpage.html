<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eduboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
                  url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: #000;
    }

    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.3);
      z-index: 1;
    }

    .container {
      text-align: center;
      z-index: 3;
      animation: fadeInUp 1.5s ease forwards;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Gradient animated title */
   h1 {
  font-size: 3.5rem;
  font-weight: bold;
  margin-bottom: 15px;
  font-family: Georgia, 'Times New Roman', Times, serif;
  background: linear-gradient(270deg, #ff0080, #ff8c00, #40e0d0, #0052D4, #ff0080);
  background-size: 600% 600%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientFlow 8s ease infinite;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


    @keyframes gradientFlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #333;
    }

    .btn {
      padding: 14px 32px;
      font-size: 17px;
      background: linear-gradient(135deg, #0052D4, #4364F7);
      color: #fff;
      border: none;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.3s ease, background-color 0.3s;
      display: inline-block;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.05);
      background: #003399;
    }

    /* Floating math bubbles */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: 2;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      font-size: 3rem;
      font-weight: bold;
      color: transparent;
      background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      animation: floatUp linear infinite, colorShift 6s linear infinite;
      text-shadow: 0px 0px 12px rgba(255,255,255,0.6);
    }

    /* Floating animation */
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
    }

    /* Rainbow shifting */
    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Different bubble positions */
    .bubble:nth-child(1) { left: 10%; animation-duration: 12s; }
    .bubble:nth-child(2) { left: 30%; animation-duration: 15s; animation-delay: 2s; }
    .bubble:nth-child(3) { left: 55%; animation-duration: 18s; animation-delay: 4s; }
    .bubble:nth-child(4) { left: 75%; animation-duration: 20s; animation-delay: 6s; }
  </style>
</head>
<body>

  <div class="bubbles">
    <div class="bubble">+</div>
    <div class="bubble">−</div>
    <div class="bubble">×</div>
    <div class="bubble">÷</div>
  </div>

  <div class="container">
    <h1>EDUBOARD</h1>
    <p>The student portal for learning and growth</p>
    <a href="stdntreg.html" class="btn">Get Started</a>
  </div>

</body>
</html>
