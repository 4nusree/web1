<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EduBoard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Floating Bubbles -->
  <div class="bubbles">
    <div class="bubble">+</div>
    <div class="bubble">−</div>
    <div class="bubble">×</div>
    <div class="bubble">÷</div>
  </div>

  <!-- Alert Message -->
  <div id="alertBox" class="alert"></div>

  <!-- Student Registration -->
  <main class="auth-container">
    <div class="glass-card auth-box">
      <h2 class="gradient-text">Student Registration</h2>
      <form onsubmit="handleStudentRegister(event)">
        <div class="input-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label for="reg-email">Email ID</label>
          <input type="email" id="reg-email" placeholder="example@mail.com" required>
        </div>
        <div class="input-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="john123" required>
        </div>
        <div class="input-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="********" required>
          <span class="eye-icon" onclick="togglePasswordVisibility('reg-password', this)">○</span>
        </div>
        <div class="input-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="********" required>
          <span class="eye-icon" onclick="togglePasswordVisibility('reg-confirm', this)">○</span>
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
      </form>
      <div class="link-text">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
