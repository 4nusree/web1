<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | EduBoard</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)),
                  url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .register-box {
      position: relative;
      z-index: 3;
      width: 380px;
      background: rgba(255, 255, 255, 0.15);
      padding: 40px 30px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      text-align: center;
      animation: fadeInUp 1.5s ease forwards;
      border: 1px solid rgba(0,0,0,0.2);
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .register-box h2 {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 25px;
      background: linear-gradient(270deg, #ff0080, #ff8c00, #40e0d0, #0052D4, #ff0080);
      background-size: 600% 600%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 8s ease infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
      text-align: left;
    }

    .input-group label {
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
      color: #000;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.3);
      color: #000;
    }

    .input-group input::placeholder {
      color: #555;
    }

    .eye-icon {
      position: absolute;
      right: 12px;
      top: 38px;
      cursor: pointer;
      font-size: 16px;
      color: #000;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      padding: 4px 6px;
      user-select: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      background: linear-gradient(135deg, #0052D4, #4364F7);
      color: #fff;
      transition: transform 0.3s ease, background 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.05);
      background: #003399;
    }

    .login-link, .forgot-link {
      margin-top: 15px;
      font-size: 14px;
      color: #000;
    }

    .login-link a, .forgot-link a {
      color: #0052D4;
      text-decoration: underline;
    }

    /* Floating bubbles effect */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: 2;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      font-size: 2.5rem;
      font-weight: bold;
      color: transparent;
      background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      animation: floatUp linear infinite, colorShift 6s linear infinite;
      text-shadow: 0px 0px 10px rgba(255,255,255,0.6);
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
    }

    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bubble:nth-child(1) { left: 10%; animation-duration: 12s; }
    .bubble:nth-child(2) { left: 30%; animation-duration: 15s; animation-delay: 2s; }
    .bubble:nth-child(3) { left: 55%; animation-duration: 18s; animation-delay: 4s; }
    .bubble:nth-child(4) { left: 75%; animation-duration: 20s; animation-delay: 6s; }
  </style>
</head>
<body>

  <div class="bubbles">
    <div class="bubble">+</div>
    <div class="bubble">−</div>
    <div class="bubble">×</div>
    <div class="bubble">÷</div>
  </div>

  <div class="register-box">
    <h2>Student Registration</h2>
    <form action="/student/dashboard" method="POST">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="fullname" placeholder="John Doe" required />
      </div>

      <div class="input-group">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required />
      </div>

      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="john123" required />
      </div>

      <div class="input-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="********" required />
        <span class="eye-icon" id="togglePassword" onclick="togglePassword()">👁️</span>
      </div>

      <div class="input-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm_password" placeholder="********" required />
        <span class="eye-icon" id="toggleConfirm" onclick="toggleConfirm()">👁️</span>
      </div>

      <button class="btn" type="submit">Register</button>
    </form>

    <div class="forgot-link">
      <a href="forgot_password.html">Forgot Password?</a>
    </div>

    <div class="login-link">
      Already have an account? <a href="student_login.html">Login here</a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('togglePassword');
      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "👁️";
      } else {
        input.type = "password";
        icon.textContent = "🙈";
      }
    }

    function toggleConfirm() {
      const input = document.getElementById('confirm');
      const icon = document.getElementById('toggleConfirm');
      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "👁️";
      } else {
        input.type = "password";
        icon.textContent = "🙈";
      }
    }
  </script>

</body>
</html>
